name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "cursor/**"]

permissions:
  contents: read

jobs:
  update-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - name: Make a test update key
        working-directory: server
        run: go run ./cmd/updatekey -gen "$RUNNER_TEMP/shamm-keys"
      - uses: actions/upload-artifact@v4
        with:
          name: update-key
          retention-days: 1
          path: |
            ${{ runner.temp }}/shamm-keys/update.pub
            ${{ runner.temp }}/shamm-keys/update.priv
          if-no-files-found: error

  server:
    needs: update-key
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: server
        run: go test ./...
      - uses: actions/download-artifact@v4
        with:
          name: update-key
          path: keys
      - name: Build server
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p ../dist
          pub="$(tr -d ' \n\r' < ../keys/update.pub)"
          go build -trimpath -ldflags "-s -w -X schooldesk/internal/update.PublicKeyBase64=${pub}" -o "../dist/schooldesk-server-${GOOS}-${GOARCH}${ext}" ./cmd/schooldesk-server
      - name: Raspberry Pi package
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sh packaging/build-deb.sh dist/schooldesk-server-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/schooldesk-server-*
          if-no-files-found: error
      - name: Upload Pi package
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: pi-server
          path: |
            dist/schooldesk-server-linux-arm64
            dist/shamm-school-server_1.0.0_arm64.deb
            packaging/pi-setup.sh
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Choose signing key
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > schooldesk-release.jks
            export KEY_ALIAS_VALUE="${KEY_ALIAS:-schooldesk}"
            export KEY_PASSWORD_VALUE="${KEY_PASSWORD:-$STORE_PASSWORD}"
            python3 - << 'PY'
          import os
          path = "android/key.properties"
          with open(path, "w", encoding="utf-8") as fh:
              fh.write("storePassword=" + os.environ["STORE_PASSWORD"] + "\n")
              fh.write("keyPassword=" + os.environ["KEY_PASSWORD_VALUE"] + "\n")
              fh.write("keyAlias=" + os.environ["KEY_ALIAS_VALUE"] + "\n")
              fh.write("storeFile=../../schooldesk-release.jks\n")
          PY
            echo "Signed with the release keystore from repository secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Android signing::No release keystore secret was found. This APK is debug-signed. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD so later updates install over the same app."
            {
              echo "No release keystore secret was found."
              echo
              echo "This APK is **debug-signed**. A later release signed with a different key will not install over it."
              echo "Add these repository secrets to use the real key:"
              echo
              echo "- \`ANDROID_KEYSTORE_BASE64\`"
              echo "- \`ANDROID_KEYSTORE_PASSWORD\`"
              echo "- \`ANDROID_KEY_ALIAS\` (optional, default \`schooldesk\`)"
              echo "- \`ANDROID_KEY_PASSWORD\` (optional, defaults to the store password)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build apk
        working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-app:
    needs: update-key
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Windows desktop app
        working-directory: app
        run: flutter build windows --release
      - uses: actions/download-artifact@v4
        with:
          name: update-key
          path: keys
      - name: Build Windows server
        working-directory: server
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          $pub = (Get-Content ..\keys\update.pub -Raw).Trim()
          go build -trimpath -ldflags "-s -w -X schooldesk/internal/update.PublicKeyBase64=$pub" -o ..\dist\schooldesk-server-windows-amd64.exe .\cmd\schooldesk-server
      - name: Stage app files
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path app\build\windows -Recurse -Filter schooldesk.exe |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "schooldesk.exe was not produced" }
          $release = $exe.Directory.FullName
          Write-Host "Release folder: $release"
          New-Item -ItemType Directory -Force -Path dist\windows-app | Out-Null
          Copy-Item -Path (Join-Path $release '*') -Destination dist\windows-app -Recurse -Force
          if (-not (Test-Path dist\schooldesk-server-windows-amd64.exe)) {
            throw "Windows server exe is missing"
          }
          Copy-Item dist\schooldesk-server-windows-amd64.exe (Join-Path $release 'schooldesk-server.exe') -Force
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) { throw "Windows app exited $($proc.ExitCode)" }
          $ready = $false
          foreach ($i in 1..10) {
            try {
              $res = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8741/api/v1/health -TimeoutSec 2
              if ($res.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "Windows server did not answer" }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bmp.Save((Join-Path (Get-Location) 'dist\windows-smoke.png'))
          Stop-Process -Id $proc.Id -Force
      - name: Check the Windows window is not blank
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::FromFile((Resolve-Path dist\windows-smoke.png))
          $step = [Math]::Max(1, [int]($bmp.Width / 40))
          $sum = 0.0
          $sum2 = 0.0
          $n = 0
          for ($y = 0; $y -lt $bmp.Height; $y += $step) {
            for ($x = 0; $x -lt $bmp.Width; $x += $step) {
              $c = $bmp.GetPixel($x, $y)
              $l = (0.3 * $c.R) + (0.59 * $c.G) + (0.11 * $c.B)
              $sum += $l
              $sum2 += ($l * $l)
              $n++
            }
          }
          $mean = $sum / $n
          $var = ($sum2 / $n) - ($mean * $mean)
          Write-Host "windows screenshot variance $var"
          if ($var -lt 40) { throw "screenshot is mostly one colour" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:RUNNER_TEMP\innosetup.exe"
            $proc = Start-Process -FilePath "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              throw "Inno Setup installer exited $($proc.ExitCode)"
            }
          }
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found" }
          Write-Host "Using $iscc"
          & $iscc packaging\SchoolDesk.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          & $iscc packaging\ShammClient.iss
          if ($LASTEXITCODE -ne 0) { throw "client ISCC failed with $LASTEXITCODE" }
          if (-not (Test-Path dist\ShammSchool-Server-Setup.exe)) { throw "ShammSchool-Server-Setup.exe was not written" }
          if (-not (Test-Path dist\ShammSchool-Client-Setup.exe)) { throw "ShammSchool-Client-Setup.exe was not written" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-server-installer
          path: dist/ShammSchool-Server-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client-installer
          path: dist/ShammSchool-Client-Setup.exe
          if-no-files-found: error

  macos-app:
    needs: update-key
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - name: Build macOS desktop app
        working-directory: app
        run: flutter build macos --release
      - uses: actions/download-artifact@v4
        with:
          name: update-key
          path: keys
      - name: Build universal server
        working-directory: server
        run: |
          set -euo pipefail
          mkdir -p ../dist
          pub="$(tr -d ' \n\r' < ../keys/update.pub)"
          ld="-s -w -X schooldesk/internal/update.PublicKeyBase64=${pub}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$ld" -o ../dist/schooldesk-server-darwin-arm64 ./cmd/schooldesk-server
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$ld" -o ../dist/schooldesk-server-darwin-amd64 ./cmd/schooldesk-server
          lipo -create -output ../dist/schooldesk-server-darwin ../dist/schooldesk-server-darwin-arm64 ../dist/schooldesk-server-darwin-amd64
          lipo -info ../dist/schooldesk-server-darwin
      - name: Bundle server and make disk image
        run: |
          set -euo pipefail
          app=$(find app/build/macos/Build/Products/Release -name '*.app' -maxdepth 1 | head -1)
          if [ -z "$app" ]; then
            echo "macOS app was not produced"
            exit 1
          fi
          staged="dist/SchoolDesk.app"
          rm -rf "$staged"
          cp -R "$app" "$staged"
          cp dist/schooldesk-server-darwin "$staged/Contents/MacOS/schooldesk-server"
          chmod +x "$staged/Contents/MacOS/schooldesk-server"
          xattr -cr "$staged" || true
          while IFS= read -r -d '' bin; do
            if file "$bin" | grep -q 'Mach-O'; then
              codesign --force --sign - "$bin"
            fi
          done < <(find "$staged/Contents" -type f -print0)
          codesign --force --sign - --entitlements app/macos/Runner/Release.entitlements "$staged"
          codesign --verify --verbose=2 "$staged"
          lipo -info "$staged/Contents/MacOS/schooldesk-server"
          bash scripts/smoke-mac.sh "$PWD/$staged" 8741 "$PWD/dist/macos-smoke.png" prod
          rm -f dist/SchoolDesk.dmg
          hdiutil create -volname "SchoolDesk" -srcfolder "$staged" -ov -format UDZO "dist/SchoolDesk.dmg"
          test -f dist/SchoolDesk.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/SchoolDesk.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-smoke
          path: dist/macos-smoke.png
          if-no-files-found: error

  macos-demo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test the sample school
        working-directory: app
        run: flutter test test/school_book_test.dart test/widget_test.dart test/roles_home_test.dart
      - name: Click through the demo
        working-directory: app
        env:
          SCHOOLDESK_SHOTS: ${{ github.workspace }}/dist/demo-shots
        run: flutter test test/demo_walk_test.dart test/mac_window_test.dart test/marks_table_test.dart test/attendance_entry_test.dart --dart-define=SCHOOLDESK_DEMO=true
      - name: Build demo Mac app
        working-directory: app
        run: flutter build macos --release --dart-define=SCHOOLDESK_DEMO=true
      - name: Bundle demo disk image
        run: |
          set -euo pipefail
          app=$(find app/build/macos/Build/Products/Release -name '*.app' -maxdepth 1 | head -1)
          if [ -z "$app" ]; then
            echo "Demo app was not produced"
            exit 1
          fi
          staged="dist/SchoolDesk-Demo.app"
          rm -rf "$staged" dist/dmg
          mkdir -p dist/dmg
          cp -R "$app" "$staged"
          info="$staged/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName SchoolDesk Demo" "$info"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.ninemultimedia.schooldesk.demo" "$info"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string SchoolDesk Demo" "$info" || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SchoolDesk Demo" "$info"
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 11.0" "$info" || /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 11.0" "$info"
          if [ -e "$staged/Contents/MacOS/schooldesk-server" ]; then
            echo "The demo must not ship a server"
            exit 1
          fi
          xattr -cr "$staged" || true
          while IFS= read -r -d '' bin; do
            if file "$bin" | grep -q 'Mach-O'; then
              codesign --force --options runtime --sign - "$bin"
            fi
          done < <(find "$staged/Contents" -type f -print0)
          codesign --force --deep --options runtime --sign - --entitlements app/macos/Runner/Demo.entitlements "$staged"
          codesign --verify --deep --strict --verbose=2 "$staged"
          lipo -info "$staged/Contents/MacOS/schooldesk" || file "$staged/Contents/MacOS/schooldesk"
          bash scripts/quarantine-mac.sh "$PWD/$staged" "$PWD/dist/gatekeeper.txt"
          bash scripts/smoke-mac.sh "$PWD/$staged" 0 "$PWD/dist/macos-demo-smoke.png" desk
          cp -R "$staged" "dist/dmg/SchoolDesk Demo.app"
          cp "packaging/Open SchoolDesk Demo.command" "dist/dmg/Open SchoolDesk Demo.command"
          chmod +x "dist/dmg/Open SchoolDesk Demo.command"
          rm -f dist/SchoolDesk-Demo.dmg
          hdiutil create -volname "SchoolDesk Demo" -srcfolder dist/dmg -ov -format UDZO "dist/SchoolDesk-Demo.dmg"
          xattr -w com.apple.quarantine "0083;$(date +%s);Google Drive;00000000-0000-0000-0000-000000000000" dist/SchoolDesk-Demo.dmg || true
          echo "The disk image carries the quarantine attribute a Drive download would add. Mounting that image from the runner can stall on a Gatekeeper prompt, so the open check is done on the app copy above." | tee -a dist/gatekeeper.txt
          xattr -l dist/SchoolDesk-Demo.dmg | tee -a dist/gatekeeper.txt || true
          test -f dist/SchoolDesk-Demo.dmg
      - name: Show the startup log
        if: always()
        run: |
          mkdir -p dist
          echo "---- SchoolDesk startup log ----"
          if [[ -f "$HOME/Library/Logs/SchoolDesk/startup.log" ]]; then
            cat "$HOME/Library/Logs/SchoolDesk/startup.log" | tee dist/startup.log
          else
            echo "(no startup log)" | tee dist/startup.log
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-demo
          path: dist/SchoolDesk-Demo.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-demo-smoke
          if-no-files-found: warn
          path: |
            dist/macos-demo-smoke.png
            dist/macos-demo-smoke-home.png
            dist/admin-home.png
            dist/director-home.png
            dist/homeroom-home.png
            dist/subject-home.png
            dist/fees.png
            dist/marks.png
            dist/students.png
            dist/classes.png
            dist/class-detail.png
            dist/class-marks.png
            dist/class-marks-sorted.png
            dist/class-fees.png
            dist/attendance-by-number.png
            dist/marks-entry-by-number.png
            dist/student-search.png
            dist/student-profile.png
            dist/results.png
            dist/attendance.png
            dist/timetable.png
            dist/reports.png
            dist/staff.png
            dist/gatekeeper.txt
            dist/startup.log

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: App screens
        working-directory: app
        run: |
          flutter test test/shamm_shots_test.dart
          mkdir -p "$GITHUB_WORKSPACE/dist/screenshots"
          cp test/goldens/shamm-*.png "$GITHUB_WORKSPACE/dist/screenshots/"
      - uses: browser-actions/setup-chrome@v1
      - name: Server status page
        run: |
          set -euo pipefail
          mkdir -p dist/screenshots /tmp/shamm-data
          (cd server && go build -o /tmp/shamm-server ./cmd/schooldesk-server)
          /tmp/shamm-server --data /tmp/shamm-data --addr 127.0.0.1:8741 --no-mdns &
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8741/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then echo "chrome was not installed"; exit 1; fi
          "$chrome" --headless --disable-gpu --no-sandbox --window-size=1200,900 --screenshot="$PWD/dist/screenshots/status.png" http://127.0.0.1:8741/ || true
          if [ ! -s dist/screenshots/status.png ] && [ -s screenshot.png ]; then
            mv screenshot.png dist/screenshots/status.png
          fi
          test -s dist/screenshots/status.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist/screenshots/*.png
          if-no-files-found: error

  release-sms:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, android, windows-app, screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: pi-server
          path: pi
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: windows-server-installer
          path: win-server
      - uses: actions/download-artifact@v4
        with:
          name: windows-client-installer
          path: win-client
      - uses: actions/download-artifact@v4
        with:
          name: update-key
          path: keys
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - name: Sign a sample update and publish sms-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p payload dist
          find artifacts -name 'schooldesk-server-linux-amd64' -exec cp {} payload/server-linux-amd64 \;
          find artifacts -name 'schooldesk-server-linux-arm64' -exec cp {} payload/server-linux-arm64 \;
          find artifacts -name 'schooldesk-server-windows-amd64.exe' -exec cp {} payload/server-windows-amd64.exe \;
          find apk -name 'app-release.apk' -exec cp {} payload/client.apk \;
          find win-client -name 'ShammSchool-Client-Setup.exe' -exec cp {} payload/client-windows.exe \;
          test -s payload/server-linux-amd64
          test -s payload/server-linux-arm64
          test -s payload/server-windows-amd64.exe
          test -s payload/client.apk
          test -s payload/client-windows.exe
          (cd server && go run ./cmd/updatekey -key "$GITHUB_WORKSPACE/keys/update.priv" -dir "$GITHUB_WORKSPACE/payload" -version sms-v1 -schema 2 -out "$GITHUB_WORKSPACE/dist/shamm-update-sms-v1.smsu")
          cp keys/update.pub dist/update.pub
          find win-server -name 'ShammSchool-Server-Setup.exe' -exec cp {} dist/ \;
          find win-client -name 'ShammSchool-Client-Setup.exe' -exec cp {} dist/ \;
          find apk -name 'app-release.apk' -exec cp {} dist/ \;
          find pi -name 'shamm-school-server_1.0.0_arm64.deb' -exec cp {} dist/ \;
          find pi -name 'pi-setup.sh' -exec cp {} dist/ \;
          find pi -name 'schooldesk-server-linux-arm64' -exec cp {} dist/ \;
          files=(
            dist/ShammSchool-Server-Setup.exe
            dist/ShammSchool-Client-Setup.exe
            dist/app-release.apk
            dist/shamm-update-sms-v1.smsu
            dist/update.pub
          )
          if [ -f dist/shamm-school-server_1.0.0_arm64.deb ]; then files+=(dist/shamm-school-server_1.0.0_arm64.deb); fi
          if [ -f dist/pi-setup.sh ]; then files+=(dist/pi-setup.sh); fi
          if [ -f dist/schooldesk-server-linux-arm64 ]; then files+=(dist/schooldesk-server-linux-arm64); fi
          notes=$'Shamm School Management Systems.\n\nThe sample update is signed with the test key in update.pub. Make your own key before a real school uses updates. See docs/SETUP.md.'
          if gh release view sms-v1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload sms-v1 "${files[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create sms-v1 "${files[@]}" --repo "${{ github.repository }}" --title "Shamm School Management Systems" --notes "$notes"
          fi

  release-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && endsWith(github.repository, '/schooldesk-demo')
    needs: macos-demo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-demo
          path: dist
      - name: Publish the demo disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f dist/SchoolDesk-Demo.dmg
          if gh release view demo-v16 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload demo-v16 dist/SchoolDesk-Demo.dmg --repo "${{ github.repository }}" --clobber
          else
            gh release create demo-v16 dist/SchoolDesk-Demo.dmg \
              --repo "${{ github.repository }}" \
              --title "SchoolDesk Demo" \
              --notes "Standalone Mac demo. It opens on this computer with no server and no sign-in."
          fi
