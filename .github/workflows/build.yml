name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: server
        run: go test ./...
      - name: Build server
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w" -o "../dist/schooldesk-server-${GOOS}-${GOARCH}${ext}" ./cmd/schooldesk-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/schooldesk-server-*
          if-no-files-found: error
      - name: Upload Pi package
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: pi-server
          path: |
            dist/schooldesk-server-linux-arm64
            packaging/pi-setup.sh
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Choose signing key
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > schooldesk-release.jks
            export KEY_ALIAS_VALUE="${KEY_ALIAS:-schooldesk}"
            export KEY_PASSWORD_VALUE="${KEY_PASSWORD:-$STORE_PASSWORD}"
            python3 - << 'PY'
          import os
          path = "android/key.properties"
          with open(path, "w", encoding="utf-8") as fh:
              fh.write("storePassword=" + os.environ["STORE_PASSWORD"] + "\n")
              fh.write("keyPassword=" + os.environ["KEY_PASSWORD_VALUE"] + "\n")
              fh.write("keyAlias=" + os.environ["KEY_ALIAS_VALUE"] + "\n")
              fh.write("storeFile=../../schooldesk-release.jks\n")
          PY
            echo "Signed with the release keystore from repository secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Android signing::No release keystore secret was found. This APK is debug-signed. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD so later updates install over the same app."
            {
              echo "No release keystore secret was found."
              echo
              echo "This APK is **debug-signed**. A later release signed with a different key will not install over it."
              echo "Add these repository secrets to use the real key:"
              echo
              echo "- \`ANDROID_KEYSTORE_BASE64\`"
              echo "- \`ANDROID_KEYSTORE_PASSWORD\`"
              echo "- \`ANDROID_KEY_ALIAS\` (optional, default \`schooldesk\`)"
              echo "- \`ANDROID_KEY_PASSWORD\` (optional, defaults to the store password)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build apk
        working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Windows desktop app
        working-directory: app
        run: flutter build windows --release
      - name: Build Windows server
        working-directory: server
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          go build -trimpath -ldflags "-s -w" -o ..\dist\schooldesk-server-windows-amd64.exe .\cmd\schooldesk-server
      - name: Stage app files
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path app\build\windows -Recurse -Filter schooldesk.exe |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "schooldesk.exe was not produced" }
          $release = $exe.Directory.FullName
          Write-Host "Release folder: $release"
          New-Item -ItemType Directory -Force -Path dist\windows-app | Out-Null
          Copy-Item -Path (Join-Path $release '*') -Destination dist\windows-app -Recurse -Force
          if (-not (Test-Path dist\schooldesk-server-windows-amd64.exe)) {
            throw "Windows server exe is missing"
          }
          Copy-Item dist\schooldesk-server-windows-amd64.exe (Join-Path $release 'schooldesk-server.exe') -Force
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) { throw "Windows app exited $($proc.ExitCode)" }
          $ready = $false
          foreach ($i in 1..10) {
            try {
              $res = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8741/api/v1/health -TimeoutSec 2
              if ($res.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "Windows server did not answer" }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bmp.Save((Join-Path (Get-Location) 'dist\windows-smoke.png'))
          Stop-Process -Id $proc.Id -Force
      - name: Check the Windows window is not blank
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::FromFile((Resolve-Path dist\windows-smoke.png))
          $step = [Math]::Max(1, [int]($bmp.Width / 40))
          $sum = 0.0
          $sum2 = 0.0
          $n = 0
          for ($y = 0; $y -lt $bmp.Height; $y += $step) {
            for ($x = 0; $x -lt $bmp.Width; $x += $step) {
              $c = $bmp.GetPixel($x, $y)
              $l = (0.3 * $c.R) + (0.59 * $c.G) + (0.11 * $c.B)
              $sum += $l
              $sum2 += ($l * $l)
              $n++
            }
          }
          $mean = $sum / $n
          $var = ($sum2 / $n) - ($mean * $mean)
          Write-Host "windows screenshot variance $var"
          if ($var -lt 40) { throw "screenshot is mostly one colour" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:RUNNER_TEMP\innosetup.exe"
            $proc = Start-Process -FilePath "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              throw "Inno Setup installer exited $($proc.ExitCode)"
            }
          }
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found" }
          Write-Host "Using $iscc"
          & $iscc packaging\SchoolDesk.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          if (-not (Test-Path dist\SchoolDesk-Setup.exe)) { throw "SchoolDesk-Setup.exe was not written" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/SchoolDesk-Setup.exe
          if-no-files-found: error

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - name: Build macOS desktop app
        working-directory: app
        run: flutter build macos --release
      - name: Build universal server
        working-directory: server
        run: |
          set -euo pipefail
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/schooldesk-server-darwin-arm64 ./cmd/schooldesk-server
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/schooldesk-server-darwin-amd64 ./cmd/schooldesk-server
          lipo -create -output ../dist/schooldesk-server-darwin ../dist/schooldesk-server-darwin-arm64 ../dist/schooldesk-server-darwin-amd64
          lipo -info ../dist/schooldesk-server-darwin
      - name: Bundle server and make disk image
        run: |
          set -euo pipefail
          app=$(find app/build/macos/Build/Products/Release -name '*.app' -maxdepth 1 | head -1)
          if [ -z "$app" ]; then
            echo "macOS app was not produced"
            exit 1
          fi
          staged="dist/SchoolDesk.app"
          rm -rf "$staged"
          cp -R "$app" "$staged"
          cp dist/schooldesk-server-darwin "$staged/Contents/MacOS/schooldesk-server"
          chmod +x "$staged/Contents/MacOS/schooldesk-server"
          xattr -cr "$staged" || true
          while IFS= read -r -d '' bin; do
            if file "$bin" | grep -q 'Mach-O'; then
              codesign --force --sign - "$bin"
            fi
          done < <(find "$staged/Contents" -type f -print0)
          codesign --force --sign - --entitlements app/macos/Runner/Release.entitlements "$staged"
          codesign --verify --verbose=2 "$staged"
          lipo -info "$staged/Contents/MacOS/schooldesk-server"
          bash scripts/smoke-mac.sh "$PWD/$staged" 8741 "$PWD/dist/macos-smoke.png" prod
          rm -f dist/SchoolDesk.dmg
          hdiutil create -volname "SchoolDesk" -srcfolder "$staged" -ov -format UDZO "dist/SchoolDesk.dmg"
          test -f dist/SchoolDesk.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/SchoolDesk.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-smoke
          path: dist/macos-smoke.png
          if-no-files-found: error

  macos-demo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test the sample school
        working-directory: app
        run: flutter test test/school_book_test.dart test/widget_test.dart test/roles_home_test.dart
      - name: Click through the demo
        working-directory: app
        env:
          SCHOOLDESK_SHOTS: ${{ github.workspace }}/dist/demo-shots
        run: flutter test test/demo_walk_test.dart --dart-define=SCHOOLDESK_DEMO=true
      - name: Build demo Mac app
        working-directory: app
        run: flutter build macos --release --dart-define=SCHOOLDESK_DEMO=true
      - name: Bundle demo disk image
        run: |
          set -euo pipefail
          app=$(find app/build/macos/Build/Products/Release -name '*.app' -maxdepth 1 | head -1)
          if [ -z "$app" ]; then
            echo "Demo app was not produced"
            exit 1
          fi
          staged="dist/SchoolDesk-Demo.app"
          rm -rf "$staged" dist/dmg
          mkdir -p dist/dmg
          cp -R "$app" "$staged"
          info="$staged/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName SchoolDesk Demo" "$info"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.ninemultimedia.schooldesk.demo" "$info"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string SchoolDesk Demo" "$info" || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SchoolDesk Demo" "$info"
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 11.0" "$info" || /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 11.0" "$info"
          if [ -e "$staged/Contents/MacOS/schooldesk-server" ]; then
            echo "The demo must not ship a server"
            exit 1
          fi
          xattr -cr "$staged" || true
          while IFS= read -r -d '' bin; do
            if file "$bin" | grep -q 'Mach-O'; then
              codesign --force --options runtime --sign - "$bin"
            fi
          done < <(find "$staged/Contents" -type f -print0)
          codesign --force --deep --options runtime --sign - --entitlements app/macos/Runner/Demo.entitlements "$staged"
          codesign --verify --deep --strict --verbose=2 "$staged"
          lipo -info "$staged/Contents/MacOS/schooldesk" || file "$staged/Contents/MacOS/schooldesk"
          bash scripts/quarantine-mac.sh "$PWD/$staged" "$PWD/dist/gatekeeper.txt"
          bash scripts/smoke-mac.sh "$PWD/$staged" 0 "$PWD/dist/macos-demo-smoke.png" desk
          cp -R "$staged" "dist/dmg/SchoolDesk Demo.app"
          cp "packaging/Open SchoolDesk Demo.command" "dist/dmg/Open SchoolDesk Demo.command"
          chmod +x "dist/dmg/Open SchoolDesk Demo.command"
          rm -f dist/SchoolDesk-Demo.dmg
          hdiutil create -volname "SchoolDesk Demo" -srcfolder dist/dmg -ov -format UDZO "dist/SchoolDesk-Demo.dmg"
          xattr -w com.apple.quarantine "0083;$(date +%s);Google Drive;00000000-0000-0000-0000-000000000000" dist/SchoolDesk-Demo.dmg || true
          rm -rf /tmp/sd-mount
          mkdir -p /tmp/sd-mount
          hdiutil attach dist/SchoolDesk-Demo.dmg -mountpoint /tmp/sd-mount -nobrowse
          echo "Mounted disk image. Quarantine on the image does not by itself clear the copy." | tee -a dist/gatekeeper.txt
          hdiutil detach /tmp/sd-mount || true
          test -f dist/SchoolDesk-Demo.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-demo
          path: dist/SchoolDesk-Demo.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-demo-smoke
          path: |
            dist/macos-demo-smoke.png
            dist/macos-demo-smoke-home.png
            dist/demo-shots
            dist/gatekeeper.txt
          if-no-files-found: error
